# Production and staging stack. Run from the repository root:
#   docker compose -f ops/docker-compose.yml --env-file ops/.env up -d --build
# ops/.env holds POSTGRES_PASSWORD, MASTER_KEY, API_HOST (e.g. cloud.restrovia.in) and ACME_EMAIL.
# The admin and owner web apps are added here in phases 4 and 5.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: restrovia_cloud
      POSTGRES_USER: restrovia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restrovia -d restrovia_cloud']
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://restrovia:${POSTGRES_PASSWORD}@postgres:5432/restrovia_cloud
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_HOST: ${API_HOST:?set API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
