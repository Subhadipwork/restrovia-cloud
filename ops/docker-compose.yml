# Production and staging stack. Run from the repository root:
#   docker compose -f ops/docker-compose.yml --env-file ops/.env up -d --build
# ops/.env holds the settings in ops/env.example; docs/DEPLOY.md walks through a first deploy.
# The owner web app is added here in phase 4.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: restrovia_cloud
      POSTGRES_USER: restrovia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Reachable from the server itself only, for ops/backup.sh; never open this port publicly.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restrovia -d restrovia_cloud']
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://restrovia:${POSTGRES_PASSWORD}@postgres:5432/restrovia_cloud
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      LICENCE_SIGNING_KEY: ${LICENCE_SIGNING_KEY:?set LICENCE_SIGNING_KEY}
      LICENCE_KEY_ID: ${LICENCE_KEY_ID:-k1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-outbox}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Restrovia <no-reply@restrovia.shop>}
      OWNER_APP_URL: ${OWNER_APP_URL:-https://app.restrovia.shop}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-https://admin.restrovia.shop}
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_HOST: ${API_HOST:?set API_HOST}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST}
      UPDATES_HOST: ${UPDATES_HOST:?set UPDATES_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./updates:/srv/updates:ro
      - caddy_data:/data
    depends_on:
      - api
      - admin

volumes:
  pgdata:
  caddy_data:
